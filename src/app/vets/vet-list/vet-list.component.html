<div class="container-fluid">
  <div class="container xd-container">

    <h2>Veterinarians</h2>
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <table id="vets" class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Specialties</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (vet of vets(); track vet) {
          <tr>
            <td>
              {{ vet.firstName }} {{ vet.lastName }}
            </td>
            <td>
              @for (spec of vet.specialties; track spec) {
                <div>
                  {{ spec.name }}
                </div>
              }
            </td>
            <td>
              <button class="btn btn-secondary" (click)="editVet(vet)">Edit Vet</button>
              <button class="btn btn-secondary" (click)="deleteVet(vet)">Delete Vet</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
    <div>
      @if (isVetDataReceived()) {
        <button class="btn btn-secondary" (click)="gotoHome()">Home</button>
      }
      @if (isVetDataReceived()) {
        <button class="btn btn-secondary" (click)="addVet()">Add Vet</button>
      }
    </div>
  </div>
