<div class="container-fluid">
  <div class="container xd-container">
    <h2>Edit Pet Type</h2>
    <form id="pettype" (ngSubmit)="onSubmit(pettypeForm.value)" #pettypeForm="ngForm" novalidate>
      <input type="hidden" id="id" [(ngModel)]="pettype.id" name="id" />
      <div class="row mb-3">
        <label for="name" class="col-sm-2 col-form-label">Name</label>
        <div class="col-sm-8">
          <input id="name" name="name" class="form-control" minlength="1" maxlength="80" pattern="^[A-Za-z0-9].{0,79}$" required type="text" [(ngModel)]="pettype.name" #name="ngModel" [class.is-valid]="name.dirty && name.valid" [class.is-invalid]="name.dirty && name.invalid" />
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('maxlength')">Name may be only 80 characters long</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('minlength')">Name must be at least 1 character long</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('pattern')">Name must begin with a letter or digit</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('required')">Name is required</div>
        </div>
        <div class="col-sm-2 mt-2 mt-sm-0 d-flex gap-2">
          <button class="btn btn-secondary" type="submit" [disabled]="pettypeForm.invalid">Update</button>
          <button class="btn btn-secondary" type="button" (click)="onBack()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
