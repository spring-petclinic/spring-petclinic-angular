@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

<div [hidden]="deleteSuccess()" class="row g-4">
  <div class="col-lg-5">
    <table class="table table-striped mb-2">
      <tbody>
        <tr>
          <th class="w-25">Name</th>
          <td>{{ pet().name }}</td>
        </tr>
        <tr>
          <th>Birth Date</th>
          <td>{{ pet().birthDate }}</td>
        </tr>
        <tr>
          <th>Type</th>
          <td>{{ pet().type?.name }}</td>
        </tr>
      </tbody>
    </table>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-secondary" (click)="editPet(pet())">Edit Pet</button>
      <button class="btn btn-secondary" (click)="deletePet(pet())">Delete Pet</button>
      <button class="btn btn-secondary" (click)="addVisit(pet())">Add Visit</button>
    </div>
  </div>
  <div class="col-lg-7">
    <app-visit-list [visits]="pet().visits" />
  </div>
</div>
