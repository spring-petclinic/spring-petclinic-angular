<div class="container-fluid">
  <div class="container xd-container">
    <h2>Pet</h2>
    <form (ngSubmit)="onSubmit(petForm.value)" #petForm="ngForm" novalidate>
      <input type="hidden" id="id" [(ngModel)]="pet.id" name="id" />
      <input type="hidden" id="owner" [(ngModel)]="pet.owner" name="owner" />

      <div class="row mb-3">
        <label for="owner_name" class="col-sm-2 col-form-label">Owner</label>
        <div class="col-sm-10">
          <input id="owner_name" name="owner_name" class="form-control" type="text" value="{{ currentOwner.firstName }} {{ currentOwner.lastName }}" readonly />
        </div>
      </div>

      <div class="row mb-3">
        <label for="name" class="col-sm-2 col-form-label">Name</label>
        <div class="col-sm-10">
          <input id="name" name="name" class="form-control" minlength="1" maxlength="30" pattern="^[A-Za-z0-9].{0,29}$" required type="text" [(ngModel)]="pet.name" #name="ngModel" [class.is-valid]="name.dirty && name.valid" [class.is-invalid]="name.dirty && name.invalid" />
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('required')">Name is required</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('minlength')">Name must be at least 1 character long</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('maxlength')">Name may be at most 30 characters long</div>
          <div class="invalid-feedback" *ngIf="name.dirty && name.hasError('pattern')">Name must begin with a letter or digit</div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="birthDate" class="col-sm-2 col-form-label">Birth Date</label>
        <div class="col-sm-10">
          <input id="birthDate" matInput [matDatepicker]="birthDateDatepicker" required [ngModel]="pet.birthDate | date:'yyyy-MM-dd'" name="birthDate" #birthDate="ngModel" [class.is-valid]="birthDate.dirty && birthDate.valid" [class.is-invalid]="birthDate.dirty && birthDate.invalid" />
          <mat-datepicker-toggle matSuffix [for]="birthDateDatepicker"></mat-datepicker-toggle>
          <mat-datepicker #birthDateDatepicker></mat-datepicker>
          <div class="invalid-feedback" *ngIf="birthDate.dirty && birthDate.hasError('required')">Birth date is required</div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="type" class="col-sm-2 col-form-label">Type</label>
        <div class="col-sm-10">
          <div class="row g-2">
            <div class="col-sm-3">
              <input id="type1" name="type1" class="form-control" type="text" value="{{ currentType.name }}" readonly />
            </div>
            <div class="col-sm-9">
              <select id="type" name="pettype" class="form-select" required [(ngModel)]="currentType" #pettype="ngModel" [class.is-valid]="pettype.dirty && pettype.valid" [class.is-invalid]="pettype.dirty && pettype.invalid">
                <option *ngFor="let petType of petTypes" [selected]="petType.id === currentType.id ? true : null" [ngValue]="petType">{{ petType.name }}</option>
              </select>
              <div class="invalid-feedback" *ngIf="pettype.dirty && pettype.hasError('required')">Pet type is required</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="offset-sm-2 col-sm-10 d-flex gap-2">
          <button class="btn btn-secondary" type="button" (click)="gotoOwnerDetail(pet.owner)">Back</button>
          <button class="btn btn-secondary" type="submit" [disabled]="petForm.invalid">Update Pet</button>
        </div>
      </div>
    </form>
  </div>
</div>
