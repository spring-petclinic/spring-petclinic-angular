@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

@if (visitList().length > 0) {
  <table class="table table-striped mb-0">
    <thead>
      <tr>
        <th>Visit Date</th>
        <th>Description</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (visit of visitList(); track visit.id) {
        <tr>
          <td>{{ visit.date }}</td>
          <td>{{ visit.description }}</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-secondary btn-sm me-2" (click)="editVisit(visit)">Edit Visit</button>
            <button class="btn btn-secondary btn-sm" (click)="deleteVisit(visit)">Delete Visit</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p class="text-secondary mb-0">No visits yet.</p>
}
